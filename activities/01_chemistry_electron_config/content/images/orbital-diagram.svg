<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>

  <!-- Title Area -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Electron Configuration Builder
  </text>

  <!-- Electron Bank Area -->
  <rect x="20" y="60" width="180" height="500" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="10"/>
  <text x="110" y="85" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Electron Bank
  </text>
  <text x="110" y="105" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">
    Drag electrons from here
  </text>

  <!-- Draggable electron placeholders (visual guide) -->
  <rect x="40" y="120" width="60" height="50" fill="#ffffff" stroke="#3498db" stroke-width="1" stroke-dasharray="5,5" rx="5"/>
  <text x="70" y="150" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
    Spin Up (↑)
  </text>

  <rect x="120" y="120" width="60" height="50" fill="#ffffff" stroke="#3498db" stroke-width="1" stroke-dasharray="5,5" rx="5"/>
  <text x="150" y="150" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
    Spin Down (↓)
  </text>

  <rect x="40" y="185" width="60" height="50" fill="#ffffff" stroke="#3498db" stroke-width="1" stroke-dasharray="5,5" rx="5"/>
  <text x="70" y="215" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
    Spin Up (↑)
  </text>

  <rect x="120" y="185" width="60" height="50" fill="#ffffff" stroke="#3498db" stroke-width="1" stroke-dasharray="5,5" rx="5"/>
  <text x="150" y="215" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
    Spin Down (↓)
  </text>

  <rect x="40" y="250" width="60" height="50" fill="#ffffff" stroke="#3498db" stroke-width="1" stroke-dasharray="5,5" rx="5"/>
  <text x="70" y="280" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
    Spin Up (↑)
  </text>

  <rect x="120" y="250" width="60" height="50" fill="#ffffff" stroke="#3498db" stroke-width="1" stroke-dasharray="5,5" rx="5"/>
  <text x="150" y="280" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
    Spin Up (↑)
  </text>

  <rect x="40" y="315" width="60" height="50" fill="#ffffff" stroke="#3498db" stroke-width="1" stroke-dasharray="5,5" rx="5"/>
  <text x="70" y="345" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
    Spin Up (↑)
  </text>

  <rect x="120" y="315" width="60" height="50" fill="#ffffff" stroke="#3498db" stroke-width="1" stroke-dasharray="5,5" rx="5"/>
  <text x="150" y="345" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
    Spin Down (↓)
  </text>

  <!-- Orbital Diagram Area -->
  <rect x="220" y="60" width="560" height="500" fill="#fff" stroke="#34495e" stroke-width="2" rx="10"/>

  <!-- Energy level labels -->
  <text x="250" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Oxygen (O) - Atomic Number 8
  </text>
  <text x="250" y="125" font-family="Arial, sans-serif" font-size="14" fill="#555">
    Total electrons: 8
  </text>

  <!-- Energy axis -->
  <line x1="250" y1="180" x2="250" y2="520" stroke="#7f8c8d" stroke-width="2"/>
  <text x="235" y="185" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#2c3e50">
    Energy ↑
  </text>

  <!-- 1s orbital -->
  <text x="265" y="290" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    1s
  </text>
  <rect x="310" y="265" width="70" height="60" fill="#e8f8f5" stroke="#16a085" stroke-width="3" rx="5"/>
  <rect x="400" y="265" width="70" height="60" fill="#e8f8f5" stroke="#16a085" stroke-width="3" rx="5"/>

  <!-- 2s orbital -->
  <text x="265" y="365" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    2s
  </text>
  <rect x="310" y="340" width="70" height="60" fill="#fef5e7" stroke="#f39c12" stroke-width="3" rx="5"/>
  <rect x="400" y="340" width="70" height="60" fill="#fef5e7" stroke="#f39c12" stroke-width="3" rx="5"/>

  <!-- 2p orbitals -->
  <text x="265" y="450" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    2p
  </text>
  <rect x="310" y="425" width="70" height="60" fill="#fadbd8" stroke="#e74c3c" stroke-width="3" rx="5"/>
  <rect x="400" y="425" width="70" height="60" fill="#fadbd8" stroke="#e74c3c" stroke-width="3" rx="5"/>
  <rect x="490" y="425" width="70" height="60" fill="#fadbd8" stroke="#e74c3c" stroke-width="3" rx="5"/>
  <rect x="580" y="425" width="70" height="60" fill="#fadbd8" stroke="#e74c3c" stroke-width="3" rx="5"/>

  <!-- Orbital sublabels -->
  <text x="345" y="260" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">↑</text>
  <text x="435" y="260" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">↓</text>

  <text x="345" y="335" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">↑</text>
  <text x="435" y="335" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">↓</text>

  <text x="345" y="420" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">2px ↑</text>
  <text x="435" y="420" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">2py ↑</text>
  <text x="525" y="420" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">2pz ↑</text>
  <text x="615" y="420" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">2px ↓</text>

  <!-- Instructions box -->
  <rect x="240" y="510" width="520" height="40" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" rx="5"/>
  <text x="500" y="535" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2c3e50">
    Drop electrons into the boxes following Aufbau principle, Hund's rule, and Pauli exclusion principle
  </text>
</svg>
